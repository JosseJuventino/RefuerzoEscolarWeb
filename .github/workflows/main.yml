jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Web
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/html/RefuerzoEscolarWeb/refuerzo-web/
            git fetch --prune
            git reset --hard origin/main
            bun install
            bun run build
            pm2 restart refuerzo-web

  deploy-api:
    runs-on: ubuntu-latest
    needs: deploy-web  # Espera a que deploy-web termine
    steps:
      - name: Deploy API
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/html/RefuerzoEscolarWeb/refuerzo-apiv2/
            git fetch --prune
            git reset --hard origin/main
            bun install
            bun run build
            pm2 restart apiv2
